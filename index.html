<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#191b1f" />
    <script>
      try {
        const theme =
          localStorage.getItem("velumix:appearance") === "light"
            ? "light"
            : "dark";
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === "dark" ? "#191b1f" : "#f6f7f9";
      } catch {}
    </script>
    <link rel="icon" type="image/png" sizes="48x48" href="/images/brand/favicon-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/images/brand/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="canonical" href="https://velumix.github.io/" />
    <meta
      name="description"
      content="Software engineer building native applications, developer tools, interactive interfaces, and games. Explore Rust, C#, Go, React, and Luau projects and open-source contributions."
    />
    <meta
      property="og:title"
      content="Velumix — Software Engineer & Developer"
    />
    <meta
      property="og:description"
      content="Native apps, agent systems, code intelligence, web interfaces, open-source contributions, and gameplay engineering."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://velumix.github.io/" />
    <meta
      property="og:image"
      content="https://velumix.github.io/images/og-card.jpg"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Velumix — Software & gameplay engineer portfolio"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:image"
      content="https://velumix.github.io/images/og-card.jpg"
    />
    <meta
      name="twitter:title"
      content="Velumix — Software Engineer & Developer"
    />
    <meta
      name="twitter:description"
      content="Native apps, agent systems, code intelligence, web interfaces, open-source contributions, and gameplay engineering."
    />
    <title>Velumix — Software Engineer & Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript
      ><p>
        Velumix — software engineer and developer. Enable JavaScript to explore
        my work, or visit <a href="https://github.com/velumix">my GitHub</a> and
        the <a href="/observatory/">Aquatica engineering docs</a>.
      </p></noscript
    >
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
